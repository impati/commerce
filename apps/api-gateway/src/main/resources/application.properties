spring.application.name=api-gateway
server.port=8080
management.endpoints.web.exposure.include=health,info,metrics
clients.member.url=http://localhost:8101
clients.display.url=http://localhost:8103
clients.catalog.url=http://localhost:8102
clients.inventory.url=http://localhost:8104
clients.cart.url=http://localhost:8105
clients.order.url=http://localhost:8108
clients.shipping.url=http://localhost:8107
clients.notification.url=http://localhost:8109


# 접근 토큰 검증. 공개키만 갖는다 — 이 서비스는 유일한 퍼블릭 인그레스이므로 발급 능력을 두지
# 않는다. member.access-token.private-key와 짝이며 운영에서는 함께 교체한다 (ADR-0007).
gateway.access-token.issuer=impati-member
gateway.access-token.public-key=MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEaMi9hQTWkLk4Z56rJeDWxAlVwFJCOSryzCAHD/PWJ9cyM78bZQKml8sfuvfVJ8wfGi3YmDzEs0+d3nrxexBdIw==

# member-service 장애 판정. 열려 있는 동안 만료된 접근 토큰을 outage-tolerance까지 받는다
# (PD-0014-R9). 401·404는 실패로 세지 않으므로 폐기된 세션이 판정을 흔들지 않는다 (ADR-0008).
gateway.member-service.failure-threshold=5
gateway.member-service.outage-tolerance=PT24H
gateway.member-service.probe-interval=30000
