spring.application.name=catalog-service
server.port=8102
management.endpoints.web.exposure.include=health,info


# 서비스마다 데이터베이스를 나누고 인스턴스는 공유한다. 경계는 스키마가 만든다.
#
# 연결 시간대를 UTC로 고정한다. 저장 타입이 datetime(6)이라 시간대를 담지 않으므로
# 세션 시간대가 다르면 OffsetDateTime을 쓰고 읽을 때 값이 옮겨진다. 점유가 시각 비교로
# 배타성을 만들기 때문에 그 어긋남은 곧 배타성이 깨지는 것이다 (ADR-0013).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/catalog_service?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:commerce}
spring.datasource.password=${DB_PASSWORD:commerce}
spring.flyway.locations=classpath:db/migration
