spring.application.name=member-service
server.port=8101
management.endpoints.web.exposure.include=health,info


spring.datasource.url=jdbc:h2:file:./.data/member-service
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.locations=classpath:db/migration
clients.notification.url=http://localhost:8109
member.verification-ttl=PT24H
member.session-ttl=P14D

# 인증 메일 아웃박스 발송 (BL-0004, ADR-0010).
# interval은 아웃박스를 비우는 주기이며 @Scheduled가 밀리초만 받으므로 단위가 다르다.
# retry-delay는 한 건이 실패한 뒤 다시 집히기까지의 최소 간격이고 그 값이 곧 점유가 유지되는
# 시간이다. batch-size는 한 주기에 시도하는 건수의 상한으로, 밀린 건수가 한 주기의 길이를
# 정하지 않게 한다. max-attempts를 넘기면 FAILED로 남기고 포기한다 — 사용자에게 재발송
# 경로가 있고, 만료된 토큰을 계속 보내려 들 이유가 없다.
member.verification-mail-dispatch-interval=1000
member.verification-mail-retry-delay=60s
member.verification-mail-batch-size=50
member.verification-mail-max-attempts=3

# 접근 토큰 서명. 아래 키는 로컬 개발용이며 운영에서는 반드시 교체한다 — 개인키가 유출되면
# 임의 신원을 위조할 수 있다. 공개키는 api-gateway가 갖고 검증만 한다 (ADR-0007).
member.access-token.ttl=PT5M
member.access-token.issuer=impati-member
