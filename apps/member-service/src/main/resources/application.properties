spring.application.name=member-service
server.port=8101
management.endpoints.web.exposure.include=health,info


# 서비스마다 데이터베이스를 나누고 인스턴스는 공유한다. 경계는 스키마가 만든다.
#
# 연결 시간대를 UTC로 고정한다. 저장 타입이 datetime(6)이라 시간대를 담지 않으므로
# 세션 시간대가 다르면 OffsetDateTime을 쓰고 읽을 때 값이 옮겨진다. 점유가 시각 비교로
# 배타성을 만들기 때문에 그 어긋남은 곧 배타성이 깨지는 것이다 (ADR-0013).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/member_service?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:commerce}
spring.datasource.password=${DB_PASSWORD:commerce}
spring.flyway.locations=classpath:db/migration
clients.notification.url=http://localhost:8109
member.verification-ttl=PT24H
member.session-ttl=P14D

# 인증 메일 아웃박스 발송 (BL-0004, ADR-0010).
# interval만 밀리초다 — @Scheduled가 그것만 받는다. retry-delay는 점유가 유지되는 시간이자
# 실패 후 다시 집히기까지의 간격이고, retry-delay × max-attempts가 재시도 창이다.
member.verification-mail-dispatch-interval=1000
member.verification-mail-retry-delay=60s
member.verification-mail-batch-size=50
member.verification-mail-max-attempts=60

# 접근 토큰 서명. 아래 키는 로컬 개발용이며 운영에서는 반드시 교체한다 — 개인키가 유출되면
# 임의 신원을 위조할 수 있다. 공개키는 api-gateway가 갖고 검증만 한다 (ADR-0007).
member.access-token.ttl=PT5M
