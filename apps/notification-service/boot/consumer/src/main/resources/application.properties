spring.config.import=classpath:application-shared.properties

spring.application.name=notification-consumer
server.port=8129

# 오프셋을 우리가 올린다. 자동 커밋은 처리 전에 올리므로 컨슈머가 죽으면 그 사건이 사라진다.
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

# 그룹이 오프셋을 잃었을 때 그동안의 사건을 건너뛰지 않는다. 중복은 멱등 키가 막지만 유실은
# 막을 것이 없다 (ADR-0016).
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:notification-order-events}

# 사건은 JSON이다. 스키마 레지스트리가 없으므로 대상 타입을 설정으로 알려준다 (ADR-0016).
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.impati.commerce.common.ApiContracts$OrderEventMessage
# 역직렬화가 임의 클래스를 만들지 못하게 패키지를 좁힌다. 넓히면 메시지로 클래스를 고르게 된다.
spring.kafka.consumer.properties.spring.json.trusted.packages=com.impati.commerce.common
