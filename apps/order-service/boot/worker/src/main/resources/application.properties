spring.config.import=classpath:application-shared.properties

spring.application.name=order-worker
server.port=8118

# 체크아웃 복구 스케줄러의 실행 주기.
orders.checkout-recovery-period-ms=10000
orders.event-publish-interval=1000

# 체크아웃 복구는 중단된 단계부터 다시 실행하므로 각 단계의 협력 서비스 URL이 필요하다.
# 사건 발행은 브로커로 나가므로 알림 URL은 없다 (ADR-0016, ADR-0018).
clients.cart.url=http://localhost:8105
clients.inventory.url=http://localhost:8104
clients.payment.url=http://localhost:8106
clients.shipping.url=http://localhost:8107
