spring.config.import=classpath:application-shared.properties

spring.application.name=order-worker
server.port=8118

# 스케줄러가 도는 주기. @Scheduled가 밀리초만 받으므로 아래 retry-delay와 단위가 다르다.
# 무엇을 얼마나 집고 얼마나 기다리는지(batch-size, retry-delay)는 저장소의 점유가 정하는
# 값이라 공용 설정에 있다 — API가 그 값을 쓰지는 않지만, 점유의 성질을 설명하는 곳이 하나여야
# 한다.
orders.payment-reconcile-interval=60000
orders.event-publish-interval=1000

# 워커가 부르는 둘뿐이다. 나머지 다섯은 이 실행 단위가 그 모듈을 의존하지 않으므로
# 설정도 없다 — 부르지 않는 상대의 URL을 요구하지 않는 것이 이 분리의 목적이다 (ADR-0015).
clients.payment.url=http://localhost:8106
clients.notification.url=http://localhost:8109
