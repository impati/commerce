# order-service의 API와 워커가 함께 쓰는 설정 (ADR-0014).
#
# 두 모듈이 각자 복사해 두면 반드시 어긋나고, 어긋나면 API와 워커가 서로 다른 DB나 다른
# 형제 서비스를 본다. 각 모듈의 application.properties가 spring.config.import로 가져간다.
#
# 여기 없는 것: 웹 포트와 애플리케이션 이름(실행 단위마다 다르다), 스케줄러 주기(워커만 쓴다),
# 그리고 협력자 URL — 부르는 단위만 그 설정을 갖는다 (ADR-0015).

management.endpoints.web.exposure.include=health,info

# 주문 사건 발행 (ADR-0012, ADR-0017).
# retry-delay는 실패 뒤 다시 집히기까지의 최소 간격이면서 묶음 점유가 유지되는 임차 기간이다.
# 한 번에 집은 건을 다 처리하기 전에 임차가 만료되면 다른 인스턴스가 같은 주문을 집어 순서
# 보장이 무너지므로, 관계(주문 수 × 주문당 사건 수 × 건당 최악(max-block + send-timeout) ≤
# retry-delay)를 기동 시 검증한다. 3 × 12 × 22초 = 792초 ≤ 800초.
orders.event-publish-retry-delay=1100s
# 한 주기에 집는 주문의 수. 사건의 수가 아니다 (ADR-0016).
#
# 주문 단위로 집으면서 한 주기가 쥐는 사건이 최대 일곱 배다. 임차가 그것을 덮어야 하므로
# 주문 수를 줄여 백오프를 짧게 유지한다 — 처리량은 인스턴스를 늘려서 낸다.
orders.event-publish-orders-per-cycle=3
orders.event-publish-max-attempts=5

# 서비스마다 데이터베이스를 나누고 인스턴스는 공유한다. 경계는 스키마가 만든다.
#
# 연결 시간대를 UTC로 고정한다. 저장 타입이 datetime(6)이라 시간대를 담지 않아 저장된 값의
# 해석이 연결 설정에 달린다. 모두가 같은 값을 쓰기만 하면 되지만, 인스턴스마다 다르거나
# 시간에 걸쳐 바뀌면 예전에 쓴 값을 다르게 읽는다 (ADR-0013).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:${DB_PORT:3316}/order_service?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:commerce}
spring.datasource.password=${DB_PASSWORD:commerce}
spring.flyway.locations=classpath:db/migration

# 주문 사건 토픽 (ADR-0016).
#
# 유실을 막는 것은 acks=all 하나가 아니라 min.insync.replicas와의 조합이다. 기본값을 운영 값으로
# 두고 로컬이 내린다 — 기본이 약하면 올리는 것을 잊는 순간 조용히 유실된다.
commerce.kafka.order-events-topic=${KAFKA_ORDER_EVENTS_TOPIC:order-events}
commerce.kafka.order-events-partitions=${KAFKA_ORDER_EVENTS_PARTITIONS:3}
commerce.kafka.order-events-replicas=${KAFKA_ORDER_EVENTS_REPLICAS:3}
commerce.kafka.order-events-min-insync-replicas=${KAFKA_ORDER_EVENTS_MIN_ISR:2}
commerce.kafka.shipment-events-topic=${KAFKA_SHIPMENT_EVENTS_TOPIC:shipment-events}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9192}
spring.kafka.producer.acks=all
# 프로듀서 내부 재시도가 중복과 재정렬을 만들지 않게 한다. 파티션 안의 순서가 이것에 달려 있다.
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# 발행 타임아웃 세트 (ADR-0017). 이 값들이 서로를 모른 채 흩어져 있으면 우리가 프로듀서보다
# 먼저 포기해 성공한 사건을 FAILED로 오판한다. 한 소스로 두고 KafkaProducerTimeouts가
# 프로듀서에 실으며 관계(linger + request ≤ delivery ≤ send)를 기동 시 검증한다.
# delivery.timeout.ms 기본값은 120초라 명시하지 않으면 우리 send-timeout과 어긋난다.
commerce.kafka.linger=0ms
commerce.kafka.request-timeout=15s
commerce.kafka.delivery-timeout=15s
commerce.kafka.max-block=5s
commerce.kafka.send-timeout=17s
