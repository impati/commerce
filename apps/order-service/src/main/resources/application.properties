spring.application.name=order-service
server.port=8108
management.endpoints.web.exposure.include=health,info
clients.member.url=http://localhost:8101
clients.catalog.url=http://localhost:8102
clients.inventory.url=http://localhost:8104
clients.cart.url=http://localhost:8105
clients.payment.url=http://localhost:8106
clients.shipping.url=http://localhost:8107
clients.notification.url=http://localhost:8109

# 결제 미확인 주문의 정리 (PD-0015, ADR-0009).
# interval은 정리가 도는 주기이며 @Scheduled가 밀리초만 받으므로 단위가 다르다.
# retry-delay는 한 건이 실패한 뒤 다시 집히기까지의 최소 간격이고 그 값이 곧 점유가 유지되는
# 시간이다. batch-size는 한 주기에 시도하는 건수의 상한으로, 밀린 건수가 한 주기의 길이를
# 정하지 않게 한다.
orders.payment-reconcile-interval=60000
orders.payment-reconcile-retry-delay=60s
orders.payment-reconcile-batch-size=50

# 주문 사건 발행 (ADR-0012).
# retry-delay는 실패 뒤 다시 집히기까지의 최소 간격이면서 묶음 점유가 유지되는 임차 기간이다.
# 한 번에 집은 건을 다 처리하기 전에 임차가 만료되면 다른 인스턴스가 남은 건을 집으므로
# batch-size와의 관계(배치 × 건당 최악 4초 ≤ retry-delay)를 기동 시 검증한다.
orders.event-publish-interval=1000
orders.event-publish-retry-delay=60s
orders.event-publish-batch-size=10
orders.event-publish-max-attempts=5

spring.datasource.url=jdbc:h2:file:./.data/order-service
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.locations=classpath:db/migration
