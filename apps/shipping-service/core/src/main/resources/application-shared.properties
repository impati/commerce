# shipping-service의 API와 Worker가 함께 쓰는 설정 (ADR-0029).
management.endpoints.web.exposure.include=health,info

# 서비스마다 데이터베이스를 나누고 인스턴스는 공유한다. 경계는 스키마가 만든다.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:${DB_PORT:3316}/shipping_service?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:commerce}
spring.datasource.password=${DB_PASSWORD:commerce}
spring.flyway.locations=classpath:db/migration

commerce.kafka.shipment-events-topic=${KAFKA_SHIPMENT_EVENTS_TOPIC:shipment-events}
commerce.kafka.shipment-events-partitions=${KAFKA_SHIPMENT_EVENTS_PARTITIONS:3}
commerce.kafka.shipment-events-replicas=${KAFKA_SHIPMENT_EVENTS_REPLICAS:3}
commerce.kafka.shipment-events-min-insync-replicas=${KAFKA_SHIPMENT_EVENTS_MIN_ISR:2}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9192}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
shipping.event-publish-interval=1000
shipping.event-publish-shipments-per-cycle=3
shipping.event-publish-retry-delay=480s
shipping.event-publish-max-attempts=5
commerce.kafka.send-timeout=17s
commerce.kafka.max-block=5s
