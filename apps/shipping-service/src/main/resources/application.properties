spring.application.name=shipping-service
server.port=8107
management.endpoints.web.exposure.include=health,info


# 서비스마다 데이터베이스를 나누고 인스턴스는 공유한다. 경계는 스키마가 만든다.
#
# 연결 시간대를 UTC로 고정한다. 저장 타입이 datetime(6)이라 시간대를 담지 않아 저장된 값의
# 해석이 연결 설정에 달린다. 모두가 같은 값을 쓰기만 하면 되지만, 인스턴스마다 다르거나
# 시간에 걸쳐 바뀌면 예전에 쓴 값을 다르게 읽는다 (ADR-0013).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:${DB_PORT:3316}/shipping_service?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:commerce}
spring.datasource.password=${DB_PASSWORD:commerce}
spring.flyway.locations=classpath:db/migration
