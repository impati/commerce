plugins {
    id 'org.springframework.boot' version '3.2.3' apply false
    id 'io.spring.dependency-management' version '1.1.4' apply false
}

allprojects {
    // 좌표에 경로를 담는다.
    //
    // 이름이 겹치면 Gradle이 두 프로젝트를 같은 모듈로 보고 하나를 다른 하나로 치환한다.
    // 디렉터리를 깊게 나누면서 core와 notification 같은 이름이 여러 자리에 나오므로, 이름만으로는
    // 구분되지 않는다. 실제로 발행 어댑터가 알림 클라이언트를 의존하는 것이 순환으로 잡혔다.
    def segments = project.path.split(':').findAll { it }
    group = (['com.impati.commerce'] + (segments.size() > 1 ? segments[0..-2] : [])).join('.')
    version = '0.1.0'
}

subprojects {
    apply plugin: 'java'

    // jar 이름도 경로에서 만든다. group을 나눠도 파일 이름이 같으면 bootJar이 BOOT-INF/lib에
    // 두 개를 같은 이름으로 담으려다 실패한다 — core가 두 자리에 있어서 실제로 그랬다.
    base {
        archivesName = project.path.split(':').findAll { it }.drop(1).join('-')
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-parameters']
    }

    // 컨테이너가 필요한 테스트에 infra 태그가 붙는다. -PexcludeTags=infra로 빼면 도커 없이
    // 도는 것만 남는다 — pre-commit이 그 형태로 돈다 (ADR-0013).
    tasks.withType(Test).configureEach {
        useJUnitPlatform {
            if (project.hasProperty('excludeTags')) {
                excludeTags project.property('excludeTags').toString().split(',')
            }
        }
    }
}

project(':libs:common-contracts') {
    apply plugin: 'java-library'
}

project(':libs:test-database') {
    apply plugin: 'java-library'
}

project(':libs:test-kafka') {
    apply plugin: 'java-library'
}

// 실행 가능한 단위. bootJar이 나오는 것만 여기 들어간다.
//
// 나뉜 서비스는 api와 worker가 실행 단위이고 core는 아니다 — core에 boot 플러그인을 붙이면
// 쓰이지 않는 jar이 나오고, 무엇이 배포 대상인지가 흐려진다 (ADR-0014).
def bootModules = [
        ':apps:api-gateway', ':apps:storefront-bff', ':apps:member-service', ':apps:display-service',
        ':apps:catalog-service', ':apps:inventory-service', ':apps:cart-service',
        ':apps:payment-service',
        ':apps:shipping-service:boot:api', ':apps:shipping-service:boot:worker',
        ':apps:order-service:boot:api', ':apps:order-service:boot:worker', ':apps:order-service:boot:consumer',
        ':apps:notification-service:boot:api', ':apps:notification-service:boot:worker',
        ':apps:notification-service:boot:consumer'
]

// 스프링을 쓰는 서비스 모듈 전부. 실행 단위가 아닌 core도 포함한다.
// 소스가 없는 부모 프로젝트(:apps:order-service 같은 것)는 제외한다. 묶음일 뿐 빌드 대상이 아니다.
configure(subprojects.findAll {
    it.path.startsWith(':apps:') && it.file('src').exists()
}) {
    apply plugin: 'io.spring.dependency-management'
    if (project.path in bootModules) {
        apply plugin: 'org.springframework.boot'
    } else {
        // 라이브러리로 쓰이는 모듈. bootJar을 만들지 않고 일반 jar을 낸다.
        //
        // 스프링 BOM은 boot 플러그인이 등록해주므로 여기서는 직접 가져와야 한다. 안 하면
        // 버전 없는 의존성이 되어 해석에 실패한다.
        apply plugin: 'java-library'
        dependencyManagement {
            imports { mavenBom "org.springframework.boot:spring-boot-dependencies:3.2.3" }
        }
    }

    dependencies {
        implementation project(':libs:common-contracts')
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        implementation 'org.springframework.boot:spring-boot-starter-web'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }
}

// 서비스 간 HTTP 호출이 있는 서비스. 타임아웃이 자동 적용된다.
// 비밀번호 해싱이 필요한 서비스. spring-security-crypto만 쓰고 Security 전체는 붙이지 않는다.
configure([project(':apps:member-service')]) {
    dependencies {
        implementation 'org.springframework.security:spring-security-crypto:6.2.2'
    }
}

// access token에 서명하고 검증하는 서비스. 직접 만들지 않는 이유는 알고리즘 confusion류
// 취약점이며 근거는 docs/adr/0007에 있다. member-service가 서명하고 api-gateway는 검증만 한다.
configure([project(':apps:member-service'), project(':apps:api-gateway')]) {
    dependencies {
        implementation 'com.nimbusds:nimbus-jose-jwt:9.37.3'
    }
}

configure([
        project(':apps:order-service:infra:client:member'),
        project(':apps:order-service:infra:client:cart'),
        project(':apps:order-service:infra:client:catalog'),
        project(':apps:order-service:infra:client:inventory'),
        project(':apps:order-service:infra:client:payment'),
        project(':apps:order-service:infra:client:shipping'),
        project(':apps:api-gateway'),
        project(':apps:storefront-bff'),
        project(':apps:display-service'),
        project(':apps:cart-service'),
        project(':apps:member-service')
]) {
    dependencies {
        implementation project(':libs:common-http')
    }
}

// 영속화가 적용된 서비스. 저장소를 옮길 때마다 여기에 추가한다.
//
// 테스트도 실제 MySQL 위에서 돈다. 대역(H2)으로 검증하면 점유의 잠금 동작처럼 DB마다 다른
// 것이 검증되지 않은 채 남고, 이 저장소는 검증되지 않는 경로가 반드시 샌다는 것을 반복해서
// 겪었다 (ADR-0013).
configure([
        project(':apps:order-service:infra:persistence'),
        project(':apps:order-service:boot:api'),
        project(':apps:order-service:boot:worker'),
        project(':apps:order-service:boot:consumer'),
        project(':apps:payment-service'),
        project(':apps:notification-service:infra:persistence'),
        project(':apps:notification-service:boot:api'),
        project(':apps:notification-service:boot:worker'),
        project(':apps:notification-service:boot:consumer'),
        project(':apps:shipping-service:infra:persistence'),
        project(':apps:shipping-service:boot:api'),
        project(':apps:shipping-service:boot:worker'),
        project(':apps:cart-service'),
        project(':apps:member-service'),
        project(':apps:catalog-service'),
        project(':apps:inventory-service')
]) {
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-jdbc'
        implementation 'org.flywaydb:flyway-core'
        implementation 'org.flywaydb:flyway-mysql'
        runtimeOnly 'com.mysql:mysql-connector-j'

        testImplementation project(':libs:test-database')
    }
}

// order-service: 실행 단위(ADR-0014)와 협력자별 어댑터(ADR-0015).
//
// 각 실행 단위가 자기가 부르는 상대만 의존한다. 빌드 파일을 읽으면 "어느 단위가 누구를 부를 수
// 있나"의 답이 나오고, 부르지 않는 상대의 설정을 요구하지 않는다.
def orderClients = ['member', 'cart', 'catalog', 'inventory', 'payment', 'shipping']

configure(orderClients.collect { project(":apps:order-service:infra:client:$it") }
        + [project(':apps:order-service:infra:publisher:kafka'),
           project(':apps:order-service:infra:persistence')]) {
    dependencies {
        implementation project(':apps:order-service:core')
    }
}

// 발행 어댑터가 아는 것은 브로커뿐이다. 누가 소비하는지 모른다 (ADR-0016).
project(':apps:order-service:infra:publisher:kafka') {
    dependencies {
        implementation 'org.springframework.kafka:spring-kafka'

        testImplementation project(':libs:test-kafka')
    }
}

project(':apps:order-service:boot:api') {
    dependencies {
        implementation project(':apps:order-service:core')
        implementation project(':apps:order-service:infra:persistence')
        // 체크아웃 saga가 부르는 여섯. 알림은 부르지 않는다 — 사건이 대신한다 (ADR-0012).
        ['member', 'cart', 'catalog', 'inventory', 'payment', 'shipping'].each {
            implementation project(":apps:order-service:infra:client:$it")
        }
    }
}

project(':apps:order-service:boot:worker') {
    dependencies {
        implementation project(':apps:order-service:core')
        implementation project(':apps:order-service:infra:persistence')
        // 중단된 체크아웃이 어느 단계에서든 다시 시작할 수 있어야 하므로 네 클라이언트를 모두 둔다.
        ['cart', 'inventory', 'payment', 'shipping'].each {
            implementation project(":apps:order-service:infra:client:$it")
        }
        implementation project(':apps:order-service:infra:publisher:kafka')
    }
}

project(':apps:order-service:boot:consumer') {
    dependencies {
        implementation project(':apps:order-service:core')
        implementation project(':apps:order-service:infra:persistence')
        implementation 'org.springframework.kafka:spring-kafka'
    }
}

// shipping-service: API 요청과 복구 작업을 실행 단위로 분리한다 (ADR-0029).
project(':apps:shipping-service:core') {
    dependencies {
        implementation 'org.springframework:spring-tx'
    }
}

project(':apps:shipping-service:infra:persistence') {
    dependencies {
        implementation project(':apps:shipping-service:core')
    }
}

project(':apps:shipping-service:infra:carrier:local') {
    dependencies {
        implementation project(':apps:shipping-service:core')
    }
}

project(':apps:shipping-service:infra:publisher:kafka') {
    dependencies {
        implementation project(':apps:shipping-service:core')
        implementation 'org.springframework.kafka:spring-kafka'
    }
}

project(':apps:shipping-service:boot:api') {
    dependencies {
        implementation project(':apps:shipping-service:core')
        implementation project(':apps:shipping-service:infra:persistence')
        implementation project(':apps:shipping-service:infra:carrier:local')
    }
}

project(':apps:shipping-service:boot:worker') {
    dependencies {
        implementation project(':apps:shipping-service:core')
        implementation project(':apps:shipping-service:infra:persistence')
        implementation project(':apps:shipping-service:infra:carrier:local')
        implementation project(':apps:shipping-service:infra:publisher:kafka')
    }
}

// notification-service도 같은 모양이다. 카프카가 들어오면 컨슈머가 worker로 간다 (BL-0055).
//
// core가 테스트 픽스처를 낸다. 시계를 붙잡는 도구를 세 모듈이 함께 쓰는데, 그것을 core의
// src/main에 두면 운영 바이너리에 테스트 도구가 실린다. testFixtures는 별도 산출물이라
// testImplementation으로만 붙는다.
project(':apps:notification-service:core') {
    apply plugin: 'java-test-fixtures'
    dependencies {
        // 응용 계층이 트랜잭션 경계를 선언한다. 실행 단위 셋이 같은 유스케이스를 쓰므로
        // core에 있어야 하고, 그러면 애너테이션도 여기서 온다 — 예전에는 jdbc 스타터를 통해
        // 딸려왔지만 core에는 영속화가 없다 (ADR-0016).
        implementation 'org.springframework:spring-tx'

        testFixturesImplementation 'org.springframework:spring-context'
        testFixturesImplementation 'org.springframework.boot:spring-boot-test'
    }
}

configure([project(':apps:notification-service:infra:persistence'),
           project(':apps:notification-service:infra:mail')]) {
    dependencies {
        implementation project(':apps:notification-service:core')
    }
}

project(':apps:notification-service:boot:api') {
    dependencies {
        implementation project(':apps:notification-service:core')
        implementation project(':apps:notification-service:infra:persistence')
        testImplementation testFixtures(project(':apps:notification-service:core'))
    }
}

// 컨슈머는 브로커만 안다. 메일 어댑터를 붙이지 않는 것이 이 단위를 나눈 이유다 (ADR-0016).
project(':apps:notification-service:boot:consumer') {
    dependencies {
        implementation project(':apps:notification-service:core')
        implementation project(':apps:notification-service:infra:persistence')
        implementation 'org.springframework.kafka:spring-kafka'

        testImplementation project(':libs:test-kafka')
        testImplementation testFixtures(project(':apps:notification-service:core'))
    }
}

// 메일 어댑터는 워커만 안다. 받는 쪽이 벤더를 알 이유가 없다 (ADR-0015).
project(':apps:notification-service:boot:worker') {
    dependencies {
        implementation project(':apps:notification-service:core')
        implementation project(':apps:notification-service:infra:persistence')
        implementation project(':apps:notification-service:infra:mail')
        testImplementation testFixtures(project(':apps:notification-service:core'))
    }
}

// 나뉜 모듈의 jar 이름을 서비스가 드러나게 짓는다.
//
// 모듈 이름이 api·worker라 그대로 두면 order-service/api/build/libs/api-0.1.0.jar이 되고,
// 배포 산출물만 보면 어느 서비스의 것인지 알 수 없다.
[
        (':apps:order-service:boot:api'): 'order-api',
        (':apps:order-service:boot:worker'): 'order-worker',
        (':apps:order-service:boot:consumer'): 'order-consumer',
        (':apps:shipping-service:boot:api'): 'shipping-api',
        (':apps:shipping-service:boot:worker'): 'shipping-worker',
        (':apps:notification-service:boot:api'): 'notification-api',
        (':apps:notification-service:boot:worker'): 'notification-worker',
        (':apps:notification-service:boot:consumer'): 'notification-consumer'
].each { path, name ->
    project(path) {
        tasks.named('bootJar') { archiveBaseName = name }
    }
}
