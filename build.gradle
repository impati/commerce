plugins {
    id 'org.springframework.boot' version '3.2.3' apply false
    id 'io.spring.dependency-management' version '1.1.4' apply false
}

allprojects {
    group = 'com.impati.commerce'
    version = '0.1.0'
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-parameters']
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}

project(':libs:common-contracts') {
    apply plugin: 'java-library'
}

configure(subprojects.findAll { it.path.startsWith(':apps:') }) {
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    dependencies {
        implementation project(':libs:common-contracts')
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        implementation 'org.springframework.boot:spring-boot-starter-web'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }
}

// 영속화가 적용된 서비스. 저장소를 옮길 때마다 여기에 추가한다.
configure([
        project(':apps:order-service'),
        project(':apps:payment-service'),
        project(':apps:notification-service'),
        project(':apps:shipping-service')
]) {
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-jdbc'
        implementation 'org.flywaydb:flyway-core'
        runtimeOnly 'com.h2database:h2'
    }
}
