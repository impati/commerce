plugins {
    id 'org.springframework.boot' version '3.2.3' apply false
    id 'io.spring.dependency-management' version '1.1.4' apply false
}

allprojects {
    group = 'com.impati.commerce'
    version = '0.1.0'
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-parameters']
    }

    // 컨테이너가 필요한 테스트에 infra 태그가 붙는다. -PexcludeTags=infra로 빼면 도커 없이
    // 도는 것만 남는다 — pre-commit이 그 형태로 돈다 (ADR-0013).
    tasks.withType(Test).configureEach {
        useJUnitPlatform {
            if (project.hasProperty('excludeTags')) {
                excludeTags project.property('excludeTags').toString().split(',')
            }
        }
    }
}

project(':libs:common-contracts') {
    apply plugin: 'java-library'
}

project(':libs:test-database') {
    apply plugin: 'java-library'
}

// 실행 가능한 단위. bootJar이 나오는 것만 여기 들어간다.
//
// 나뉜 서비스는 api와 worker가 실행 단위이고 core는 아니다 — core에 boot 플러그인을 붙이면
// 쓰이지 않는 jar이 나오고, 무엇이 배포 대상인지가 흐려진다 (ADR-0014).
def bootModules = [
        ':apps:api-gateway', ':apps:member-service', ':apps:display-service',
        ':apps:catalog-service', ':apps:inventory-service', ':apps:cart-service',
        ':apps:payment-service', ':apps:shipping-service',
        ':apps:order-service:api', ':apps:order-service:worker',
        ':apps:notification-service:api', ':apps:notification-service:worker'
]

// 스프링을 쓰는 서비스 모듈 전부. 실행 단위가 아닌 core도 포함한다.
// 소스가 없는 부모 프로젝트(:apps:order-service 같은 것)는 제외한다. 묶음일 뿐 빌드 대상이 아니다.
configure(subprojects.findAll {
    it.path.startsWith(':apps:') && it.file('src').exists()
}) {
    apply plugin: 'io.spring.dependency-management'
    if (project.path in bootModules) {
        apply plugin: 'org.springframework.boot'
    } else {
        // 라이브러리로 쓰이는 모듈. bootJar을 만들지 않고 일반 jar을 낸다.
        //
        // 스프링 BOM은 boot 플러그인이 등록해주므로 여기서는 직접 가져와야 한다. 안 하면
        // 버전 없는 의존성이 되어 해석에 실패한다.
        apply plugin: 'java-library'
        dependencyManagement {
            imports { mavenBom "org.springframework.boot:spring-boot-dependencies:3.2.3" }
        }
    }

    dependencies {
        implementation project(':libs:common-contracts')
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        implementation 'org.springframework.boot:spring-boot-starter-web'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }
}

// 서비스 간 HTTP 호출이 있는 서비스. 타임아웃이 자동 적용된다.
// 비밀번호 해싱이 필요한 서비스. spring-security-crypto만 쓰고 Security 전체는 붙이지 않는다.
configure([project(':apps:member-service')]) {
    dependencies {
        implementation 'org.springframework.security:spring-security-crypto:6.2.2'
    }
}

// access token에 서명하고 검증하는 서비스. 직접 만들지 않는 이유는 알고리즘 confusion류
// 취약점이며 근거는 docs/adr/0007에 있다. member-service가 서명하고 api-gateway는 검증만 한다.
configure([project(':apps:member-service'), project(':apps:api-gateway')]) {
    dependencies {
        implementation 'com.nimbusds:nimbus-jose-jwt:9.37.3'
    }
}

configure([
        project(':apps:order-service:core'),
        project(':apps:api-gateway'),
        project(':apps:display-service'),
        project(':apps:cart-service'),
        project(':apps:member-service')
]) {
    dependencies {
        implementation project(':libs:common-http')
    }
}

// 영속화가 적용된 서비스. 저장소를 옮길 때마다 여기에 추가한다.
//
// 테스트도 실제 MySQL 위에서 돈다. 대역(H2)으로 검증하면 점유의 잠금 동작처럼 DB마다 다른
// 것이 검증되지 않은 채 남고, 이 저장소는 검증되지 않는 경로가 반드시 샌다는 것을 반복해서
// 겪었다 (ADR-0013).
configure([
        project(':apps:order-service:core'),
        project(':apps:order-service:api'),
        project(':apps:order-service:worker'),
        project(':apps:payment-service'),
        project(':apps:notification-service:core'),
        project(':apps:notification-service:api'),
        project(':apps:notification-service:worker'),
        project(':apps:shipping-service'),
        project(':apps:cart-service'),
        project(':apps:member-service'),
        project(':apps:catalog-service'),
        project(':apps:inventory-service')
]) {
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-jdbc'
        implementation 'org.flywaydb:flyway-core'
        implementation 'org.flywaydb:flyway-mysql'
        runtimeOnly 'com.mysql:mysql-connector-j'

        testImplementation project(':libs:test-database')
    }
}

// order-service: 실행 단위를 API와 워커로 나눈다 (ADR-0014).
//
// 절단면은 adapter/in이다 — 컨트롤러는 api, 스케줄러는 worker, 나머지는 core. api의 클래스패스에
// 워커 코드가 없다는 것이 이 구성의 요점이며, 카프카가 들어올 때 브로커 의존성이 워커에만
// 붙는 근거가 된다.
configure([project(':apps:order-service:api'), project(':apps:order-service:worker')]) {
    dependencies {
        implementation project(':apps:order-service:core')
    }
}

// notification-service도 같은 모양이다. 카프카가 들어오면 컨슈머가 worker로 간다 (BL-0055).
//
// core가 테스트 픽스처를 낸다. 시계를 붙잡는 도구를 세 모듈이 함께 쓰는데, 그것을 core의
// src/main에 두면 운영 바이너리에 테스트 도구가 실린다. testFixtures는 별도 산출물이라
// testImplementation으로만 붙는다.
project(':apps:notification-service:core') {
    apply plugin: 'java-test-fixtures'
    dependencies {
        testFixturesImplementation 'org.springframework:spring-context'
        testFixturesImplementation 'org.springframework.boot:spring-boot-test'
    }
}

configure([project(':apps:notification-service:api'), project(':apps:notification-service:worker')]) {
    dependencies {
        implementation project(':apps:notification-service:core')
        testImplementation testFixtures(project(':apps:notification-service:core'))
    }
}

// 나뉜 모듈의 jar 이름을 서비스가 드러나게 짓는다.
//
// 모듈 이름이 api·worker라 그대로 두면 order-service/api/build/libs/api-0.1.0.jar이 되고,
// 배포 산출물만 보면 어느 서비스의 것인지 알 수 없다.
[
        (':apps:order-service:api'): 'order-api',
        (':apps:order-service:worker'): 'order-worker',
        (':apps:notification-service:api'): 'notification-api',
        (':apps:notification-service:worker'): 'notification-worker'
].each { path, name ->
    project(path) {
        tasks.named('bootJar') { archiveBaseName = name }
    }
}
