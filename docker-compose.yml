services:
  # 여덟 서비스가 공유하는 MySQL. 서비스마다 데이터베이스를 나눈다.
  #
  # 8.0.16 이상을 고정한다. inventory가 재고 음수 방지에 check 제약을 쓰는데 그 아래 버전은
  # 제약을 파싱만 하고 강제하지 않는다 — 조용히 통과하는 검증은 없는 것보다 나쁘다 (ADR-0013).
  mysql:
    image: mysql:8.0.36
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: commerce
      MYSQL_PASSWORD: commerce
      MYSQL_DATABASE: commerce
    ports:
      # 3306은 흔한 포트라 다른 프로젝트의 MySQL과 부딪힌다. 호스트 쪽만 옮긴다.
      - "${MYSQL_PORT:-3316}:3306"
    volumes:
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/00-databases.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ucommerce", "-pcommerce"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 주문 사건이 흐르는 브로커. KRaft 단일 노드이며 주키퍼를 두지 않는다 (ADR-0016).
  #
  # 운영은 replication.factor=3 · min.insync.replicas=2로 유실을 막지만 여기는 노드가 하나라
  # 그 값을 쓸 수 없다. 로컬에서 확인되는 것은 흐름이고, 복제가 실제로 유실을 막는지는 아니다.
  #
  # 토픽 자동 생성을 끈다. 켜두면 없는 토픽이 브로커 기본값(파티션 1)으로 조용히 만들어지고,
  # 파티션이 하나면 키와 무관하게 전부 한 곳에 떨어져 순서 보장이 지켜지는 것처럼 보인다.
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    environment:
      # base64로 인코딩된 16바이트 UUID여야 한다. 임의 문자열을 넣으면 기동 전 검사에서
      # 거절된다. 고정값인 이유는 바뀌면 기존 데이터 디렉터리와 맞지 않기 때문이다.
      CLUSTER_ID: f4ssEU0-Sl-cbQ4aKzxNXg
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      # 호스트 쪽 광고 주소는 매핑된 포트여야 한다. 컨테이너 포트를 광고하면 호스트의
      # 클라이언트가 부트스트랩에는 성공하고 그 뒤 닫힌 포트로 안내받아 실패한다.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9192}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      # 9092도 흔한 포트라 다른 프로젝트의 브로커와 부딪힌다. mysql과 같은 이유로 호스트 쪽만 옮긴다.
      - "${KAFKA_PORT:-9192}:9092"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 20

  member-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE: member-service
        ARTIFACT: member-service
    ports:
      - "8101:8101"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/member_service?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USERNAME: commerce
      DB_PASSWORD: commerce
    depends_on:
      mysql:
        condition: service_healthy

  catalog-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE: catalog-service
        ARTIFACT: catalog-service
    ports:
      - "8102:8102"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/catalog_service?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USERNAME: commerce
      DB_PASSWORD: commerce
    depends_on:
      mysql:
        condition: service_healthy

  display-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE: display-service
        ARTIFACT: display-service
    ports:
      - "8103:8103"
    environment:
      CLIENTS_CATALOG_URL: http://catalog-service:8102
    depends_on:
      catalog-service:
        condition: service_started

  inventory-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE: inventory-service
        ARTIFACT: inventory-service
    ports:
      - "8104:8104"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/inventory_service?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USERNAME: commerce
      DB_PASSWORD: commerce
    depends_on:
      mysql:
        condition: service_healthy

  cart-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE: cart-service
        ARTIFACT: cart-service
    ports:
      - "8105:8105"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/cart_service?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USERNAME: commerce
      DB_PASSWORD: commerce
      CLIENTS_CATALOG_URL: http://catalog-service:8102
    depends_on:
      mysql:
        condition: service_healthy
      catalog-service:
        condition: service_started

  payment-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE: payment-service
        ARTIFACT: payment-service
    ports:
      - "8106:8106"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/payment_service?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USERNAME: commerce
      DB_PASSWORD: commerce
    depends_on:
      mysql:
        condition: service_healthy

  shipping-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE: shipping-service
        ARTIFACT: shipping-service
    ports:
      - "8107:8107"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/shipping_service?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USERNAME: commerce
      DB_PASSWORD: commerce
    depends_on:
      mysql:
        condition: service_healthy

  order-api:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE: order-service/boot/api
        ARTIFACT: order-api
    ports:
      - "8108:8108"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/order_service?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USERNAME: commerce
      DB_PASSWORD: commerce
      CLIENTS_MEMBER_URL: http://member-service:8101
      CLIENTS_CATALOG_URL: http://catalog-service:8102
      CLIENTS_INVENTORY_URL: http://inventory-service:8104
      CLIENTS_CART_URL: http://cart-service:8105
      CLIENTS_PAYMENT_URL: http://payment-service:8106
      CLIENTS_SHIPPING_URL: http://shipping-service:8107
      CLIENTS_NOTIFICATION_URL: http://notification-api:8109
    depends_on:
      mysql:
        condition: service_healthy
      member-service:
        condition: service_started
      catalog-service:
        condition: service_started
      inventory-service:
        condition: service_started
      cart-service:
        condition: service_started
      payment-service:
        condition: service_started
      shipping-service:
        condition: service_started
      notification-api:
        condition: service_started

  order-worker:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE: order-service/boot/worker
        ARTIFACT: order-worker
    ports:
      - "8118:8118"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/order_service?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USERNAME: commerce
      DB_PASSWORD: commerce
      CLIENTS_MEMBER_URL: http://member-service:8101
      CLIENTS_CATALOG_URL: http://catalog-service:8102
      CLIENTS_INVENTORY_URL: http://inventory-service:8104
      CLIENTS_CART_URL: http://cart-service:8105
      CLIENTS_PAYMENT_URL: http://payment-service:8106
      CLIENTS_SHIPPING_URL: http://shipping-service:8107
      CLIENTS_NOTIFICATION_URL: http://notification-api:8109
    depends_on:
      mysql:
        condition: service_healthy
      notification-api:
        condition: service_started
      payment-service:
        condition: service_started

  notification-api:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE: notification-service/boot/api
        ARTIFACT: notification-api
    ports:
      - "8109:8109"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/notification_service?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USERNAME: commerce
      DB_PASSWORD: commerce
    depends_on:
      mysql:
        condition: service_healthy

  notification-worker:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE: notification-service/boot/worker
        ARTIFACT: notification-worker
    ports:
      - "8119:8119"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/notification_service?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USERNAME: commerce
      DB_PASSWORD: commerce
    depends_on:
      mysql:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        MODULE: api-gateway
        ARTIFACT: api-gateway
    ports:
      - "8080:8080"
    environment:
      CLIENTS_MEMBER_URL: http://member-service:8101
      CLIENTS_DISPLAY_URL: http://display-service:8103
      CLIENTS_CATALOG_URL: http://catalog-service:8102
      CLIENTS_INVENTORY_URL: http://inventory-service:8104
      CLIENTS_CART_URL: http://cart-service:8105
      CLIENTS_ORDER_URL: http://order-api:8108
      CLIENTS_SHIPPING_URL: http://shipping-service:8107
      CLIENTS_NOTIFICATION_URL: http://notification-api:8109
    depends_on:
      member-service:
        condition: service_started
      display-service:
        condition: service_started
      catalog-service:
        condition: service_started
      inventory-service:
        condition: service_started
      cart-service:
        condition: service_started
      order-api:
        condition: service_started
      shipping-service:
        condition: service_started
      notification-api:
        condition: service_started

