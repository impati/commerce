// 테스트에서 실제 카프카 브로커를 띄우는 지원 모듈 (ADR-0016).
//
// libs:test-database와 나란히 두고 합치지 않는다. 합치면 DB만 쓰는 여덟 서비스가 브로커까지
// 띄운다 — 부르지 않는 상대의 설정을 요구하지 않는다는 ADR-0015의 원칙이 하네스에도 적용된다.
plugins {
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:3.2.3'
        mavenBom 'org.testcontainers:testcontainers-bom:1.19.7'
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    api 'org.testcontainers:kafka'
    api 'org.testcontainers:junit-jupiter'
    api 'org.springframework:spring-test'
    api 'org.springframework.boot:spring-boot-test'
    api 'org.springframework:spring-context'
    api 'org.apache.kafka:kafka-clients'
    api 'org.junit.jupiter:junit-jupiter-api'
}
