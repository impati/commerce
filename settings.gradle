pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'impati-commerce'

include 'libs:common-contracts'
include 'libs:common-http'
include 'libs:test-database'
include 'libs:test-kafka'
include 'apps:api-gateway'
include 'apps:storefront-bff'
include 'apps:member-service'
include 'apps:display-service'
include 'apps:catalog-service'
include 'apps:inventory-service'
include 'apps:cart-service'
// 세 갈래다 — core는 바깥을 모르고, infra는 바깥과 말하고, boot은 실행된다 (ADR-0015).
include 'apps:order-service:core'
include 'apps:order-service:infra:persistence'
include 'apps:order-service:infra:client:member'
include 'apps:order-service:infra:client:cart'
include 'apps:order-service:infra:client:catalog'
include 'apps:order-service:infra:client:inventory'
include 'apps:order-service:infra:client:payment'
include 'apps:order-service:infra:client:shipping'
include 'apps:order-service:infra:client:notification'
include 'apps:order-service:infra:publisher:kafka'
include 'apps:order-service:boot:api'
include 'apps:order-service:boot:worker'
include 'apps:order-service:boot:consumer'
include 'apps:payment-service'
include 'apps:shipping-service:core'
include 'apps:shipping-service:infra:persistence'
include 'apps:shipping-service:infra:carrier:local'
include 'apps:shipping-service:infra:publisher:kafka'
include 'apps:shipping-service:boot:api'
include 'apps:shipping-service:boot:worker'
include 'apps:notification-service:core'
include 'apps:notification-service:infra:persistence'
include 'apps:notification-service:infra:mail'
include 'apps:notification-service:boot:api'
include 'apps:notification-service:boot:worker'
include 'apps:notification-service:boot:consumer'
